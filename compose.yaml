services:
  api:
    build:
      context: .
      dockerfile: apps/api/Containerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/order-listing
      JWT_ACCESS_SECRET: change-me-access
      JWT_ACCESS_EXPIRES_IN: 5m
      JWT_REFRESH_SECRET: change-me-refresh
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000
      THROTTLE_TTL_MS: "60000"
      THROTTLE_LIMIT: "10"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "Order Listing <no-reply@order-listing.local>"
      EMAIL_VERIFICATION_URL: http://localhost:3000/verify-email
      EMAIL_VERIFICATION_EXPIRES_IN_SECONDS: "86400"
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - mailpit

  mongo:
    image: docker.io/library/mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mailpit:
    image: docker.io/axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo-data:
